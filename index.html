<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />

    <title>Shape Matching Game</title>

    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        -webkit-user-select: none;
        user-select: none;
        -webkit-tap-highlight-color: transparent;
      }

      html,
      body {
        width: 100%;
        height: 100vh; /* fallback */
        height: 100dvh; /* modern, accounts for mobile browser UI */
        overflow: hidden;
        background: #2fc4f5; /* match your Phaser gameConfig.backgroundColor */
        touch-action: none;
      }

      #game-container {
        width: 100%;
        height: 100%;
      }

      @font-face {
        font-family: "Fredoka";
        src: url("/Assets/fonts/Fjalla_One/FjallaOne-Regular.ttf");
        font-weight: 700;
        font-style: normal;
        font-display: block;
      }

      canvas {
        display: block;
      }
    </style>
  </head>

  <body>
    <div id="game-container"></div>
    <script>
      document.fonts.load('700 72px "Fredoka"').then(() => {
        window.dispatchEvent(new Event("fredoka-loaded"));
      });
    </script>
    <script type="module" src="./src/main.js"></script>
  </body>
</html>
